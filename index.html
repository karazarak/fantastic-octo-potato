<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Handover</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Archivo+Narrow:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#0f1113);--ink:light-dark(#121416,#eceef0);--mute:light-dark(#61676f,#9aa1a9);--line:light-dark(#e2e4e7,#2a2e33);--panel:light-dark(#f5f6f7,#171a1e);--red:light-dark(#c8102e,#ff5c70)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:17px/1.5 'Archivo',system-ui,sans-serif}
body{min-height:100vh;padding:max(16px,4vw)}
.wrap{max-width:900px;margin:0 auto}
.scroll{overflow-x:auto;margin-bottom:28px}
table{width:100%;border-collapse:collapse}
/* vitals */
.vt th,.vt td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.vt thead th{font:700 15px 'Archivo Narrow',sans-serif;color:var(--mute);text-align:right;background:var(--panel)}
.vt thead th:first-child{text-align:left}
.vt tbody th{text-align:left;font-weight:600;background:var(--panel);width:1%;position:sticky;left:0}
.vt tbody th small{display:block;font-size:12px;color:var(--mute);font-weight:500}
.vt td{text-align:right;font:700 22px 'Archivo Narrow',sans-serif;font-variant-numeric:tabular-nums}
.vt td.old{color:var(--mute);font-weight:600}
.vt td.empty{color:var(--line)}
.vt td small{font:600 13px 'Archivo',sans-serif;color:var(--mute);margin-left:4px}
.vt tr.g>*{border-top:2px solid var(--ink)}
.vt tbody tr:first-child>*{border-top:0}
.bad,.vt td.bad{color:var(--red)}
/* IMIST-AMBO */
.ho tr{border-bottom:1px solid var(--line)}
.ho th{width:52px;font:700 26px/1 'Archivo Narrow',sans-serif;background:var(--panel);vertical-align:top;padding:14px 0;text-align:center}
.ho td{padding:12px 16px;vertical-align:top}
.t{display:block;font-size:13px;font-weight:600;color:var(--mute)}
.ho tr.amb{border-top:2px solid var(--ink)}
.ln time{font:700 15px 'Archivo Narrow',sans-serif;color:var(--mute);margin-right:8px}
.new{animation:pop 1.2s ease-out}
@keyframes pop{from{background:color-mix(in srgb,var(--red) 18%,transparent)}to{background:transparent}}
#mic{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:88px;height:88px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.12);transition:top .35s ease,width .35s,height .35s,background .2s,color .2s}
#mic:focus-visible{outline:3px solid var(--red);outline-offset:3px}
#mic svg{width:36px;height:36px}
body.on #mic{background:var(--red);color:#fff;border-color:var(--red);animation:ring 1.6s ease-out infinite}
body.has #mic{top:auto;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);width:68px;height:68px}
body.has #mic svg{width:28px;height:28px}
body.has{padding-bottom:180px}
#st{position:fixed;left:50%;top:calc(50% + 64px);transform:translateX(-50%);width:min(90vw,520px);margin:0;text-align:center;color:var(--mute);font-size:16px;line-height:1.4;background:var(--bg);padding:4px 8px;border-radius:8px}
#st.err{color:var(--red)}
body.has #st{top:auto;bottom:calc(max(20px,env(safe-area-inset-bottom)) + 80px)}
#out{display:none}body.has #out{display:block}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--red) 45%,transparent)}100%{box-shadow:0 0 0 22px transparent}}
@media(prefers-reduced-motion:reduce){.new,body.on #mic{animation:none}#mic{transition:none}}
</style>
</head>
<body>
<div id="out" class="wrap">
  <div class="scroll"><table id="vt" class="vt"></table></div>
  <table id="tb" class="ho"></table>
</div>
<p id="st" role="status" aria-live="polite"></p>
<button id="mic" type="button" aria-label="Start listening" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
const FILL="(?:\\s*(?:'s|is|of|was|are|at|about|around|roughly|approx\\w*|sitting|sits|currently|now|it's|its|reading|reads|showing|the|:|-|=))*\\s*";
const N2='(\\d{2,3})',N1='(\\d{1,2})',ND='(\\d{1,2}(?:\\.\\d)?)';
// Vitals, in display order. g = starts a new group (thick line above). L = names, V = value pattern.
const VD=[
 {k:'BP',n:'BP',u:'mmHg',g:1,lo:90,hi:180,L:'bp|blood pressure|pressure',V:N2+'\\s*(?:/|over|on|x|by|\\*)\\s*'+N2},
 {k:'HR',n:'Pulse',u:'bpm',lo:50,hi:120,L:'hr|heart rate|pulse(?: rate)?|heart',V:N2},
 {k:'SpO2',n:'SpO₂',u:'%',g:1,lo:92,hi:101,L:'spo2|sp02|oxygen saturations?|o2 sat(?:uration)?s?|sats?|saturations?',V:N2+'\\s*%?(?:\\s*on\\s*(room air|ra\\b|\\d+\\s*(?:l|litres|liters|lpm)\\b))?'},
 {k:'RR',n:'Resp rate',u:'/min',lo:10,hi:24,L:'rr|respirat\\w*(?: rate)?|resps?(?: rate)?|breathing rate',V:N1},
 {k:'BGL',n:'BGL',u:'mmol/L',g:1,lo:4,hi:15,L:'bgl|bsl|blood sugar|blood glucose|glucose|sugar',V:ND},
 {k:'Temp',n:'Temp',u:'°C',lo:35,hi:38.5,L:'temp|temperature',V:'(\\d{2}(?:\\.\\d)?)'},
 {k:'EtCO2',n:'EtCO₂',u:'mmHg',g:1,lo:35,hi:45,L:'etco2|etco 2|et co2|etc o2|e t c o 2|end[- ]tidal(?: co2| c o 2)?|capno\\w*',V:N1},
 {k:'GCS',n:'GCS',u:'/15',g:1,opt:1,lo:15,hi:16,L:'gcs',V:N1},
 {k:'Pain',n:'Pain',u:'/10',opt:1,lo:-1,hi:7,L:'pain(?: score)?',V:N1+'(?:\\s*(?:/|out of)\\s*10)?'}
].map(d=>({...d,
  fw:new RegExp('\\b(?:'+d.L+')'+FILL+d.V+'(?![\\d.])','g'),
  rv:new RegExp('\\b'+d.V.replace('(?:\\s*on\\s*(room air|ra\\b|\\d+\\s*(?:l|litres|liters|lpm)\\b))?','')+'\\s*(?:%\\s*)?(?:for\\s+)?(?:'+d.L+')\\b','g')}));
// No name said: "130 over 85" is BP, "96%" is SpO2, "8 out of 10" is pain
const BARE=[
 {k:'BP',re:/\b(\d{2,3})\s*(?:\/|over)\s*(\d{2,3})\b/g},
 {k:'SpO2',re:/\b(\d{2,3})\s*%(?:\s*on\s*(room air|ra\b|\d+\s*(?:l|litres|liters|lpm)\b))?/g},
 {k:'Pain',re:/\b(\d{1,2})\s*(?:\/|out of)\s*10\b/g}
];
const LABEL=new RegExp('^(?:'+VD.map(d=>d.L).join('|')+')[.!?]?$');
const CAT=[
 ['A',/\b(allerg\w*|nkda|nka|anaphyla\w*)\b/],
 ['Med',/\b(meds|medications?|takes|taking|prescribed|warfarin|apixaban|rivaroxaban|dabigatran|clopidogrel|metformin|insulin)\b/],
 ['B',/\b(history|hx|pmhx|background|known to)\b/],
 ['O',/\b(lives|social|family|wife|husband|partner|daughter|son|carer|nok|travelling with)\b/],
 ['T',/\b(gave|given|administered|aspirin|gtn|salbutamol|oxygen|o2 at|nebs?|nebuli\w*|cannula\w*|iv access|glucagon|dextrose|glucose gel|fentanyl|morphine|methoxy\w*|penthrox|paracetamol|ondansetron|adrenaline|12 lead|ecg|splint\w*|collar|cpr|defib\w*)\b/],
 ['I',/\b(injur\w*|lacerat\w*|fractur\w*|deformit\w*|abrasion\w*|bruis\w*|bleeding|haematoma|tender\w*|swelling)\b/],
 ['S',/\b(pale|diaphoretic|clammy|sweaty|cyanos\w*|cyanotic|flushed|mottled|alert|drowsy|speaking|wheez\w*|crackles|pupils)\b/],
 ['M',/\b(complain\w*|c\/o|fell|fall|found|mva|mvc|collision|onset|pain|started|sudden\w*)\b/]
];
const ROWS=[['ID','I','Identification'],['M','M','Mechanism / medical complaint'],['I','I','Injuries / information'],['S','S','Signs'],['T','T','Treatment & trends'],['A','A','Allergies'],['Med','M','Medications'],['B','B','Background'],['O','O','Other / social']];

// Number words -> digits ("one ten" -> 110, "ninety four" -> 94)
const NW={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90};
function words(t){
  const out=[];let cur=null;
  const flush=p=>{if(cur!==null){out.push(String(cur)+(p||''));cur=null}else if(p)out.push(p)};
  for(const w of t.split(/\s+/)){
    const m=w.match(/^(.*?)([.,;:!?]*)$/),c=m[1],p=m[2];
    if(c in NW){const v=NW[c];if(cur===null)cur=v;else if(cur%100===0||(cur>=20&&cur%10===0&&v<10))cur+=v;else{flush();cur=v}if(p)flush(p);continue}
    if(c==='hundred'){cur=(cur||1)*100;if(p)flush(p);continue}
    if(c==='and'&&cur!==null&&cur%100===0&&cur>0)continue;
    if(/^\d{2}$/.test(c)&&cur!==null&&cur>0&&cur<10){cur=cur*100+(+c);flush(p);continue}
    flush();out.push(w);
  }
  flush();return out.join(' ');
}
function norm(text){
  let t=text.toLowerCase().replace(/[’‘]/g,"'").replace(/per ?cent/g,'%').replace(/\bsp o2\b/g,'spo2');
  t=words(t);
  t=t.replace(/(\d+)\s*point\s*(\d)/g,'$1.$2').replace(/\b([12])\s(\d{2})\b/g,'$1$2');
  return t;
}
let E=[],last=null,hold='';
try{E=JSON.parse(localStorage.getItem('handover-e'))||[]}catch(err){}
const save=()=>{try{localStorage.setItem('handover-e',JSON.stringify(E))}catch(err){}};

const IDRE=/\b(\d{1,3})\s*(?:years?[- ]old|yo|y\/o|yrs?)\b[\s,]*(male|female|man|woman|boy|girl)?/;
const NMRE=/\b(?:name is|named)\s+([a-z][a-z'-]+)/;
function put(o,d,m){
  const n=+m[1];if(d.k==='SpO2'&&(n>100||n<50))return false;if(d.k==='HR'&&n>250)return false;
  const v=d.k==='BP'?m[1]+'/'+m[2]:m[1];
  const x=d.k==='SpO2'&&m[2]?(m[2][0]==='r'?'RA':m[2].replace(/\D+/g,'')+' L'):'';
  o[d.k]={v,x,bad:n<d.lo||n>d.hi};return true;
}
function parse(t){
  const o={};let rest=t;
  for(const pass of ['fw','rv']){
    for(const d of VD){
      rest=rest.replace(d[pass],(...m)=>put(o,d,m)?' , ':m[0]);
    }
  }
  for(const b of BARE){
    if(o[b.k])continue;const d=VD.find(x=>x.k===b.k);
    rest=rest.replace(b.re,(...m)=>put(o,d,m)?' , ':m[0]);
  }
  return [o,rest];
}
function ident(t){
  const a=t.match(IDRE),nm=t.match(NMRE);
  if(!a&&!nm)return '';
  return [a?a[1]+(a[2]?(/^(male|man|boy)$/.test(a[2])?' M':' F'):''):'',nm?nm[1][0].toUpperCase()+nm[1].slice(1):''].filter(Boolean).join(' · ');
}
const FILLER=/^(?:and|so|um+|uh+|er+|ok(?:ay)?|right|then|also|the|a|with|is|are|on|of|at|his|her|their|they|he|she|and then|that's it|that is it)$/;
function chunks(rest){
  const out=[];let prev=null;
  for(let c of rest.replace(IDRE,' ').replace(NMRE,' ').split(/[.,;!?\n]+|\s+(?=(?:history|hx|past history|no known|nkda|nka|allergic|(?<!known )allerg(?:ies|y)|takes|taking|meds|medications|on (?:warfarin|apixaban|insulin|metformin)|lives|gave|given|administered|complain\w*|c\/o|found|fell|injur\w*|lacerat\w*)\b)/)){
    c=c.replace(/\s+/g,' ').trim().replace(/^(and|so|then|also)\s+/,'');
    if(!c||FILLER.test(c)||!/[a-z]{3,}/.test(c))continue;
    let cat=null;for(const [k,re] of CAT)if(re.test(c)){cat=k;break}
    if(!cat)cat=prev||'O';
    const txt=c[0].toUpperCase()+c.slice(1);
    if(prev===cat&&out.length)out[out.length-1].text+=', '+c;else out.push({cat,text:txt});
    prev=cat;
  }
  return out;
}
function render(){
  const g={ID:[],M:[],I:[],S:[],T:[],A:[],Med:[],B:[],O:[]},cols=[];let lastRow=null,lastCol=-1;
  for(const e of E){
    const t=norm(e.text);
    const [v,rest]=parse(t),id=ident(t);
    const hasV=Object.keys(v).length;
    if(id){g.ID.push(id);if(e===last)lastRow='ID'}
    if(hasV){
      // merge readings said within 3 min into one column
      const c=cols[cols.length-1];
      if(c&&e.time-c.time<180000&&!Object.keys(v).some(k=>c.v[k]))Object.assign(c.v,v);
      else cols.push({time:e.time,v:{...v}});
      if(e===last)lastCol=cols.length-1;
    }
    for(const ch of chunks(rest)){g[ch.cat].push({time:e.time,text:ch.text});if(e===last)lastRow=ch.cat}
  }
  // vitals table
  const rows=VD.filter(d=>!d.opt||cols.some(c=>c.v[d.k]));
  $('#vt').innerHTML=`<thead><tr><th>Vitals</th>${cols.length?cols.map((c,i)=>`<th>${fmt(c.time)}</th>`).join(''):'<th></th>'}</tr></thead><tbody>`+
    rows.map((d,ri)=>`<tr class="${d.g&&ri?'g':''}"><th>${d.n}<small>${d.u}</small></th>${cols.length?cols.map((c,i)=>{const x=c.v[d.k];const cls=[x?(x.bad?'bad':''):'empty',i<cols.length-1?'old':'',i===lastCol?'new':''].filter(Boolean).join(' ');return `<td class="${cls}">${x?esc(x.v)+(d.k==='SpO2'?'%':'')+(x.x?`<small>${esc(x.x)}</small>`:''):'—'}</td>`}).join(''):'<td class="empty">—</td>'}</tr>`).join('')+'</tbody>';
  // IMIST-AMBO
  const line=(e,k)=>`<div class="ln">${k==='T'?`<time>${fmt(e.time)}</time>`:''}${esc(e.text)}</div>`;
  let amb=false;
  $('#tb').innerHTML=ROWS.map(([key,letter,name],i)=>{
    const body=key==='ID'?(g.ID.length?esc(g.ID[0]):''):g[key].map(e=>line(e,key)).join('');
    if(!body)return '';
    const a=i>=5&&!amb;if(a)amb=true;
    return `<tr class="${[a?'amb':'',key===lastRow?'new':''].filter(Boolean).join(' ')}"><th>${letter}</th><td><span class="t">${name}</span>${body}</td></tr>`;
  }).join('');
  const first=$('#tb tr');if(first)first.classList.remove('amb');
  const n=document.querySelector('.new');if(n)n.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'});
  ui();
}
function heard(text){
  text=String(text||'').trim();if(!text)return;
  if(CMD(text))return;
  if(LABEL.test(norm(text).trim())){hold=text;say(text+'…');return}
  if(hold){text=hold+' '+text;hold=''}
  last={time:Date.now(),text};E.push(last);save();render();
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,running=false,wanted=false,gen=0,done={},pend={},timer=null,heardAny=false;
const mic=$('#mic'),st=$('#st');
function say(m,err){st.textContent=m||'';st.classList.toggle('err',!!err)}
function ui(){document.body.classList.toggle('on',wanted);document.body.classList.toggle('has',E.length>0);mic.setAttribute('aria-pressed',wanted);mic.setAttribute('aria-label',wanted?'Stop listening':'Start listening')}
function problem(){
  if(window.top!==window)return 'The microphone is blocked in this preview. Open the page on your website in Chrome or Safari.';
  if(!window.isSecureContext)return 'The microphone needs a secure link (https). Open the page from your website.';
  if(!SR)return 'This browser has no speech recognition. Use Chrome, or Safari on iPhone or iPad.';
  return '';
}
let burst=[],silence=null;
const CMD=t=>{const l=t.toLowerCase().replace(/[.!?]+$/,'').trim();
  if(/^(new patient|clear( all| everything)?|reset)$/.test(l)){burst=[];hold='';E=[];last=null;save();render();say('Cleared');return true}
  if(/^(scratch that|delete( that| last)?|undo)$/.test(l)){burst=[];E.pop();last=null;save();render();say('Removed last');return true}
  return false};
function piece(txt){txt=txt.trim();if(!txt||CMD(txt))return;burst.push(txt)}
function endBurst(){for(const k in pend){if(!done[k]){done[k]=1;piece(pend[k])}delete pend[k]}
  if(burst.length){const all=burst.join(' ');burst=[];heard(all)}}
function live(interim){say([...burst,interim].join(' ').trim())}
function start(){
  if(running||!wanted)return;
  const g=++gen;
  try{
    rec=new SR();rec.lang='en-AU';rec.continuous=true;rec.interimResults=true;rec.maxAlternatives=1;
    rec.onstart=()=>{if(!heardAny)say('Listening… talk normally, it sorts the vitals for you')};
    rec.onresult=ev=>{
      let interim='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){
        const r=ev.results[i],key=g+':'+i,txt=r[0].transcript.trim();
        if(!txt||done[key])continue;heardAny=true;
        if(r.isFinal){done[key]=1;delete pend[key];piece(txt)}else{pend[key]=txt;interim+=txt+' '}
      }
      live(interim.trim());
      clearTimeout(silence);silence=setTimeout(()=>{endBurst();if(!hold)say('')},2200);
    };
    rec.onerror=ev=>{
      if(/not-allowed|service-not-allowed/.test(ev.error)){wanted=false;ui();say('Speech recognition was blocked. Allow the microphone for this site, and on iPhone or iPad turn on Settings › General › Keyboard › Enable Dictation.',1)}
      else if(ev.error==='no-speech'){if(!heardAny)say('No speech heard yet. Keep talking.')}
      else if(ev.error==='network')say('Speech recognition needs an internet connection.',1);
      else if(ev.error==='audio-capture'){wanted=false;ui();say('No microphone found.',1)}
    };
    rec.onend=()=>{running=false;for(const k in pend){if(!done[k]){done[k]=1;piece(pend[k])}delete pend[k]}if(wanted)setTimeout(start,80);else{endBurst();say('')}};
    rec.start();running=true;
  }catch(err){running=false;say('Could not start listening: '+err.message,1)}
}
mic.addEventListener('click',()=>{
  const p=problem();if(p){say(p,1);return}
  wanted=!wanted;ui();
  if(wanted)start();else{if(rec){try{rec.stop()}catch(err){}}endBurst();say('')}
});
window.__test={norm,parse,heard,piece,endBurst,get E(){return E}};
render();
}
</script>
</body>
</html>
